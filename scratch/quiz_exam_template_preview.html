<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* 自足樣式：預覽不依賴 App 的 index.css。整合進 App 時改用專案設計 token 即可。 */
  :root {
    --bg-page: #f4f5f7; --bg-card: #ffffff; --bg-input: #ffffff;
    --border-card: rgba(0,0,0,.14);
    --text-primary: #111418; --text-secondary: rgba(17,20,24,.72); --text-muted: rgba(17,20,24,.55);
    --color-brand: #04A9D2; --color-brand-muted: rgba(4,169,210,.10);
    --color-danger: #d64550; --color-success: #1f9d57;
    --type-weight-strong: 600;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-page: #0f1113; --bg-card: #1b1e21; --bg-input: #23272b;
      --border-card: rgba(255,255,255,.16);
      --text-primary: #f2f4f6; --text-secondary: rgba(242,244,246,.72); --text-muted: rgba(242,244,246,.55);
      --color-brand: #35c4e6; --color-brand-muted: rgba(53,196,230,.14);
      --color-danger: #f2707a; --color-success: #46c07f;
    }
  }
  * { box-sizing: border-box; }
  body { padding: 1.25rem; max-width: 860px; margin: 0 auto; background: var(--bg-page); color: var(--text-primary);
    font-family: -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  .stat-badge { display:inline-block; font-size:.72rem; padding:.15rem .5rem; border-radius:999px; border:1px solid var(--border-card); color:var(--text-secondary); }
  .stat-badge--warning { color:#b5860b; border-color:#e0b64d; background:rgba(224,182,77,.12); }
  .primary-btn { background:var(--color-brand); color:#fff; border:none; border-radius:10px; padding:.5rem .95rem; font-size:.85rem; font-weight:var(--type-weight-strong); cursor:pointer; }
  .primary-btn:disabled { opacity:.4; cursor:not-allowed; }
  .secondary-btn { background:var(--bg-card); color:var(--text-primary); border:1px solid var(--border-card); border-radius:10px; padding:.5rem .95rem; font-size:.85rem; cursor:pointer; }
  .form-control { border:1px solid var(--border-card); border-radius:8px; padding:.45rem .6rem; background:var(--bg-input); color:var(--text-primary); font-size:.85rem; font-family:inherit; }
  .form-control:focus { outline:2px solid var(--color-brand); outline-offset:1px; }
  .exam-toolbar { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1rem; align-items:center; }
  .exam-toolbar .spacer { flex:1; }
  .exam-section { margin: 1rem 0 1.5rem; }
  .exam-section > h2 { font-size: 1rem; font-weight: var(--type-weight-strong); margin: 0 0 .35rem; color: var(--text-primary); display:flex; align-items:baseline; gap:.5rem; flex-wrap:wrap; }
  .exam-section > h2 .pts { font-size:.8rem; color: var(--text-muted); font-weight:400; }
  .q { border:1px solid var(--border-card); border-radius:12px; padding: .85rem .95rem; margin:.55rem 0; background: var(--bg-card); }
  .q-stem { font-size:.9rem; line-height:1.7; color: var(--text-primary); margin:0 0 .5rem; }
  .q-stem .n { color: var(--color-brand); font-weight: var(--type-weight-strong); margin-right:.35rem; }
  .opt { display:flex; align-items:flex-start; gap:.5rem; font-size:.875rem; line-height:1.6; padding:.2rem 0; color: var(--text-primary); }
  .opt input { margin-top:.25rem; }
  .tf-row { display:flex; gap:1.25rem; }
  .order-item select { padding:.35rem; border-radius:8px; border:1px solid var(--border-card); background:var(--bg-input); color:var(--text-primary); }
  /* 連連看：可拉線配對。左欄圓點在「右側」、右欄圓點在「左側」，線只走中間空隙 */
  .match-board { position:relative; display:grid; grid-template-columns:fit-content(46%) fit-content(46%); justify-content:space-between; column-gap:2rem; padding:.5rem 0; touch-action:manipulation; }
  .match-node .match-label { overflow-wrap:anywhere; }
  .match-lines { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; z-index:0; }
  /* 每欄的框都撐成「該欄最寬的框」的寬度 → 框邊與圓點都對齊 */
  .match-col { display:flex; flex-direction:column; align-items:stretch; gap:.55rem; min-width:0; }
  .match-node { position:relative; z-index:1; display:flex; width:100%; align-items:center; gap:.5rem; border:1px solid var(--border-card); background:var(--bg-input); color:var(--text-primary); border-radius:10px; padding:.5rem .7rem; font-size:.85rem; line-height:1.4; cursor:pointer; font-family:inherit; }
  .match-node .match-label { flex:1; overflow-wrap:anywhere; }
  .match-col--left  .match-node { flex-direction:row-reverse; }   /* 圓點在框的右緣（靠中間），各框等寬故對齊 */
  .match-col--left  .match-node .match-label { text-align:left; }
  .match-col--right .match-node { flex-direction:row; }           /* 圓點在框的左緣（靠中間），各框等寬故對齊 */
  .match-col--right .match-node .match-label { text-align:left; }  /* 文字緊接圓點、靠左，右側補白 */
  .match-node:hover { border-color:var(--color-brand); }
  .match-node.is-active { border-color:var(--color-brand); box-shadow:0 0 0 2px var(--color-brand-muted); }
  .match-node.is-linked { border-color:var(--color-brand); }
  .match-dot { width:13px; height:13px; border-radius:50%; background:var(--bg-card); border:2px solid var(--color-brand); flex-shrink:0; }
  .match-node.is-linked .match-dot { background:var(--color-brand); }
  .match-clear { margin-top:.5rem; background:none; border:1px solid var(--border-card); color:var(--text-secondary); border-radius:8px; padding:.3rem .6rem; font-size:.78rem; cursor:pointer; }
  .match-hint { font-size:.78rem; color:var(--text-muted); margin:.15rem 0 .35rem; }
  @media (max-width:480px){ .match-board{ gap:2rem; } .match-node{ font-size:.8rem; padding:.45rem .5rem; } }
  /* 事件排序：積木式拖曳 */
  .order-hint, .order-sub { font-size:.78rem; color:var(--text-muted); margin:.35rem 0 .25rem; }
  .order-sub { font-weight:var(--type-weight-strong); color:var(--text-secondary); }
  .order-answer { min-height:56px; display:flex; flex-direction:column; gap:.45rem; border:1.5px dashed var(--border-card); border-radius:12px; padding:.55rem; background:var(--bg-card); margin:.2rem 0 .5rem; transition:border-color .12s, background .12s; }
  .order-answer.drop-hot { border-color:var(--color-brand); background:var(--color-brand-muted); }
  .order-pool { display:flex; flex-wrap:wrap; gap:.45rem; padding:.15rem 0 .1rem; border-radius:10px; }
  .order-pool.drop-hot { outline:2px dashed var(--color-brand); outline-offset:3px; }
  .order-empty { color:var(--text-muted); font-size:.8rem; text-align:center; padding:.5rem; }
  .order-chip { display:flex; align-items:center; gap:.5rem; border:1px solid var(--border-card); background:var(--bg-input); color:var(--text-primary); border-radius:10px; padding:.5rem .7rem; font-size:.85rem; line-height:1.4; cursor:grab; user-select:none; touch-action:none; }
  .order-chip:active { cursor:grabbing; }
  .order-chip.is-placeholder { opacity:.3; }
  .order-chip.ghost { position:fixed; z-index:9999; margin:0; pointer-events:none; box-shadow:0 10px 24px rgba(0,0,0,.35); cursor:grabbing; }
  .order-chip .chip-grip { color:var(--text-muted); letter-spacing:-2px; }
  .order-chip .chip-text { flex:1; }
  .order-num { flex-shrink:0; min-width:1.5em; height:1.5em; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; background:var(--color-brand); color:#fff; font-size:.72rem; font-weight:var(--type-weight-strong); }
  .chip-remove { background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:.9rem; line-height:1; padding:0 .1rem; }
  .order-chip.chip-correct { border-color:var(--color-success); }
  .order-chip.chip-wrong { border-color:var(--color-danger); }
  .order-indicator { height:3px; background:var(--color-brand); border-radius:3px; }
  textarea.form-control, input.form-control, select.form-control { width:100%; box-sizing:border-box; }
  .edit-grid { display:grid; gap:.4rem; }
  .edit-grid label { font-size:.78rem; color:var(--text-muted); display:block; }
  .edit-opts { display:grid; grid-template-columns:1fr 1fr; gap:.4rem; }
  .q .del { float:right; background:none; border:none; color:var(--color-danger,#e5484d); cursor:pointer; font-size:.8rem; }
  .score-pill { font-weight:var(--type-weight-strong); }
  .hint { font-size:.78rem; color:var(--text-muted); margin:.25rem 0 0; }
  .result-line { font-size:.82rem; margin-top:.4rem; }
  .ok { color: var(--color-success, #30a46c); }
  .bad { color: var(--color-danger, #e5484d); }
  pre.json-out { white-space:pre-wrap; word-break:break-all; font-size:.72rem; background:var(--bg-input); border:1px solid var(--border-card); border-radius:10px; padding:.75rem; color:var(--text-secondary); max-height:320px; overflow:auto; }

  /* 宣示 gate */
  .pledge-overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:1rem; z-index:50; }
  .pledge-panel { background:var(--bg-card); color:var(--text-primary); border:1px solid var(--border-card); border-radius:18px; max-width:520px; width:100%; max-height:88vh; overflow-y:auto; padding:1.4rem 1.5rem; box-shadow:0 25px 50px -12px rgba(0,0,0,.4); }
  .pledge-panel h3 { margin:0 0 .25rem; font-size:1.05rem; font-weight:var(--type-weight-strong); }
  .pledge-open { font-size:.82rem; color:var(--text-secondary); margin:0 0 .9rem; line-height:1.6; }
  .pledge-panel ol { font-size:.85rem; line-height:1.75; padding-left:1.2rem; margin:0 0 1rem; }
  .pledge-consent { border:1px solid var(--border-card); background:var(--bg-input); border-radius:12px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; line-height:1.7; }
  .pledge-consent input[type=text] { border:none; border-bottom:1.5px solid var(--color-brand); background:transparent; color:var(--color-brand); font-weight:var(--type-weight-strong); font-size:.92rem; padding:.1rem .3rem; width:9rem; }
  .pledge-agree { display:flex; gap:.5rem; align-items:flex-start; font-size:.85rem; margin-bottom:1rem; }
  .pledge-start { width:100%; padding:.75rem; border-radius:12px; border:none; background:var(--color-brand); color:#fff; font-weight:var(--type-weight-strong); font-size:.9rem; cursor:pointer; }
  .pledge-start:disabled { opacity:.45; cursor:not-allowed; }

  /* 計時列 */
  .timer-bar { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:.6rem; background:var(--bg-card); border:1px solid var(--border-card); border-radius:12px; padding:.55rem .85rem; margin-bottom:.9rem; font-size:.85rem; color:var(--text-primary); }
  .timer-bar .clock { font-weight:var(--type-weight-strong); font-variant-numeric:tabular-nums; font-size:1rem; }
  .timer-bar.low { border-color:var(--color-danger,#e5484d); color:var(--color-danger,#e5484d); }
  .locked-banner { border:1px solid var(--color-brand); background:var(--color-brand-muted, rgba(4,169,210,.08)); color:var(--text-primary); border-radius:12px; padding:.75rem .95rem; margin-bottom:.9rem; font-size:.85rem; line-height:1.6; }
</style>
</head>
<body>

<div class="exam-toolbar">
  <strong style="color:var(--text-primary);">速讀測驗模板預覽</strong>
  <span class="stat-badge stat-badge--warning">草稿模板</span>
  <span class="spacer"></span>
  <button class="secondary-btn" onclick="setMode('answer')">作答模式</button>
  <button class="secondary-btn" onclick="setMode('edit')">編輯模式</button>
  <button class="primary-btn" id="action-btn" onclick="primaryAction()">送出答案</button>
  <button class="secondary-btn" onclick="resetAttempt()" title="僅供預覽，重新顯示宣示畫面">重設（測試用）</button>
</div>
<p class="hint" id="mode-note"></p>

<div id="timer-slot"></div>
<div id="exam-root"></div>

<pre class="json-out" id="json-out" hidden></pre>

<script>
/* ============================================================================
   題庫資料模型（EXAM）── 之後「填入題目」就是改這個物件，或改成從 Supabase 載入
   ------------------------------------------------------------------------------
   六大題都是 sections[]，每個 section 有 questions[]（每小題 1 筆）：

   truefalse   是非題   → { stem, answer:true/false }                每題 1 分
   single      單選題   → { stem, options[], answer:索引 }           每題 1 分
   multiple    複選題   → { stem, options[], answers:[索引...] }      每題 1 分・全對才給分
   matching    連連看   → { stem, left[], right[], answer:{左id:右id} }
                          左右數量相等、一一對應、無干擾項；作答時點左項再點右項拉線，
                          再點一次取消。整組全對才得 1 分（共 10 小題）
   ordering    事件排序 → { stem, items[](=題目呈現順序), answer:[正確順序的 id] }
                          每「小題」排 4～6 個事件，整題順序全對才得 1 分（共 10 小題）
   shortanswer 簡答題   → { stem, referenceAnswer, rubric[], maxPoints:10 }
                          人工評分，畫面只呈現作答框；管理員後台依 rubric 給 0～10 分
   ============================================================================ */
const EXAM = {
  meta: {
    title: "新生命小組教會聖經速讀測驗（創世記）",
    openAt: "2026-08-30T00:00:00+08:00",   // 開放起始（8/30 零時）
    openHours: 24,                          // 開放 24 小時
    durationMinutes: 75,                    // 單次作答限時 75 分鐘
    totalPoints: 100                        // 自動 70（一～五）＋ 人工 30（六）
  },
  // 測驗宣示：作答前必須先閱讀並同意，第 6 條姓名自動帶入
  pledge: {
    openText: "本次測驗開放時間為 8/30 零時起 24 小時內，本試卷作答時間為 75 分鐘。",
    rules: [
      "可以 OPEN 紙本聖經──接受測驗的過程當中，除了紙本聖經，我不會借助其他工具來進行答題。",
      "我清楚本次測驗開放時間為 8/30 零時起 24 小時內，本試卷作答時間為 75 分鐘。",
      "我將不會重複作答，亦即當完成測驗送交答案之後，我不會以各樣的理由要求重新接受測驗（測驗記錄亦將以第一次為準）。",
      "不管是個人或三人六人組隊，我都是獨立接受測驗，不會與其他人就測驗內容進行討論及溝通。",
      "在測驗關閉前（8/30 晚上 23 時 59 分 59 秒前）我將不會以任何的方式將題目內容洩漏給其他人。"
    ],
    consentTemplate: "{name} 清楚以上測驗規則，亦會遵守規則來完成本次測驗。"
  },
  sections: [
    {
      id: "tf", type: "truefalse", title: "一、是非題", pointsPer: 1, targetCount: 20,
      instruction: "正確請選 O，錯誤請選 X。（答案待補）",
      questions: [
        { id: "tf1", stem: "上帝用六天創造萬物，並且為萬物命名，然後第七天就安息了。", answer: null },
        { id: "tf2", stem: "亞當夏娃吃了分別善惡樹的果子，發現自己赤身露體，就用獸的皮做衣服遮掩。", answer: null },
        { id: "tf3", stem: "人造巴別塔，是為了避免分散各地，並且可以敬拜神，傳揚上帝的名。", answer: null },
        { id: "tf4", stem: "撒拉得子後，欲把夏甲與以實馬利趕出家門，神對此非常不喜悅，因此命定以實馬利將成為大國。", answer: null },
        { id: "tf5", stem: "面對兄長聯手陷害、波提乏夫人陷害、牢獄之災等困境，約瑟決心攀至高位，展開報復解心頭之恨。", answer: null },
        { id: "tf6", stem: "創世記中記載了十項誡命（十誡）。", answer: null },
        { id: "tf7", stem: "挪亞有三個兒子，分別叫做喇米、哈米和雅弗。", answer: null },
        { id: "tf8", stem: "以撒是亞伯拉罕的第一個兒子。", answer: null },
        { id: "tf9", stem: "上帝在造萬物的第三天創造了太陽、月亮和眾星，用來普照大地、分晝夜、作記號。", answer: null },
        { id: "tf10", stem: "蛇誘惑夏娃時，夏娃回答神說「不可吃，也不可摸，免得你們死」，這與神起初的吩咐一字不差。", answer: null },
        { id: "tf11", stem: "挪亞在洪水退去時，先放出一隻鴿子，鴿子找不著落腳之處飛回，後來才放出一隻烏鴉。", answer: null },
        { id: "tf12", stem: "上帝呼召亞伯蘭出哈蘭時，亞伯蘭當時已經99歲了。", answer: null },
        { id: "tf13", stem: "撒拉因不能生育，主動建議亞伯蘭納使女夏甲為妾；夏甲懷孕後，撒拉依然對她非常溫柔體貼。", answer: null },
        { id: "tf14", stem: "以撒娶利百加時年40歲，利百加婚後立刻為以撒生下雙胞胎以掃與雅各。", answer: null },
        { id: "tf15", stem: "雅各為了娶心愛的拉結，答應服事拉班七年，新婚次日早晨才發現拉班把大女兒利亞給了他。", answer: null },
        { id: "tf16", stem: "酒政和膳長在獄中同夜各做了一夢，約瑟為他們解夢，三天後膳長官復原職，酒政則被掛在木頭上。", answer: null },
        { id: "tf17", stem: "建造巴別塔的人的主要目的是要分散到全地。", answer: null },
        { id: "tf18", stem: "雅各為拉結服事拉班七年，拉班就先把拉結給了他。", answer: null },
        { id: "tf19", stem: "雅各在毗努伊勒與神摔跤後，被稱為以色列。", answer: null },
        { id: "tf20", stem: "該隱是牧羊人，亞伯是種地的。", answer: null }
      ]
    },
    {
      id: "single", type: "single", title: "二、單選題", pointsPer: 1, targetCount: 20,
      instruction: "每題僅一個最佳答案。（答案待補）",
      questions: [
        { id: "s1", stem: "創世記的作者是誰？", options: ["亞當", "亞伯拉罕", "約瑟", "摩西"], answer: null },
        { id: "s2", stem: "聖經記載第一個向上帝獻祭的人是誰？", options: ["亞當", "塞特", "亞伯拉罕", "該隱"], answer: null },
        { id: "s3", stem: "聖經記載第一個「築壇」獻祭的人是誰？", options: ["亞伯拉罕", "以撒", "雅各", "挪亞"], answer: null },
        { id: "s4", stem: "根據聖經對創世記人物壽命的計算，亞當最遠能看到自己的第幾代子孫出生？", options: ["以諾（第七代）", "瑪土撒拉（第八代）", "拉麥（第九代）", "挪亞（第十代）"], answer: null },
        { id: "s5", stem: "根據聖經對創世記人物壽命的計算，哪一位人物在世的時間與亞伯拉罕、以撒、雅各都有重疊？", options: ["挪亞", "閃", "他拉"], answer: null },
        { id: "s6", stem: "根據聖經對創世記人物壽命的計算，下列哪一位人物有最多「白髮人送黑髮人」的經歷？", options: ["挪亞", "閃", "他拉"], answer: null },
        { id: "s7", stem: "出方舟後，挪亞做的第一件事情是什麼？", options: ["尋找食物", "建立房屋", "築壇獻祭", "生兒養女"], answer: null },
        { id: "s8", stem: "根據聖經記載，第一個獻上「什一奉獻」的人物是誰？", options: ["亞伯", "挪亞", "亞伯拉罕", "雅各"], answer: null },

const isLocked = () => MODE === "answer" && submitted;

/* ------------------------------------------------------------------ 切換模式 */
function setMode(m) {
  MODE = m;
  $("#action-btn").textContent = m === "edit" ? "匯出 JSON" : "送出答案";
  $("#action-btn").disabled = m === "answer" && (!started || submitted);
  $("#json-out").hidden = true;
  $("#mode-note").textContent = m === "edit"
    ? "編輯模式：所有欄位可直接修改，可新增／刪除題目。改完按「匯出 JSON」取得題庫資料。"
    : "作答模式：需先通過測驗宣示才能作答；限時 75 分鐘，時間到自動送出；送出後鎖定不可重作。";
  render();
}
function primaryAction() {
  if (MODE === "edit") { collectEdits(); const o = $("#json-out"); o.hidden = false; o.textContent = JSON.stringify(EXAM, null, 2); return; }
  if (!started || submitted) return;
  submitExam("manual");
}

function showPledge() {
  const p = EXAM.pledge;
  const ov = document.createElement("div");
  ov.className = "pledge-overlay";
  ov.id = "pledge-overlay";
  ov.innerHTML = `<div class="pledge-panel">
    <h3>✅ 速讀測驗宣示</h3>
    <p class="pledge-open">${esc(p.openText)}</p>
    <ol>${p.rules.map(r => `<li>${esc(r)}</li>`).join("")}</ol>
    <div class="pledge-consent">
      <input type="text" id="pledge-name" value="${esc(examinee)}" aria-label="姓名">
      ${esc(p.consentTemplate.replace("{name}", "")).trim()}
    </div>
    <label class="pledge-agree"><input type="checkbox" id="pledge-agree"> 我已詳閱並同意以上全部規則，且了解送出後將以第一次記錄為準、不可重作。</label>
    <button class="pledge-start" id="pledge-start" disabled>開始作答（75 分鐘）</button>
  </div>`;
  document.body.appendChild(ov);
  const chk = ov.querySelector("#pledge-agree");
  const nameEl = ov.querySelector("#pledge-name");
  const btn = ov.querySelector("#pledge-start");
  const sync = () => { btn.disabled = !(chk.checked && nameEl.value.trim() && nameEl.value.trim() !== "（您的姓名）"); };
  chk.onchange = sync; nameEl.oninput = sync;
  btn.onclick = () => { examinee = nameEl.value.trim(); startExam(); };
}
function hidePledge() { document.getElementById("pledge-overlay")?.remove(); }

/* ------------------------------------------------------------------ 開始 / 計時 / 送出（規則 2、3）*/
function startExam() {
  started = true; submitted = false; scored = null;
  deadline = Date.now() + EXAM.meta.durationMinutes * 60 * 1000;
  hidePledge();
  clearInterval(timerId);
  timerId = setInterval(tick, 1000);
  setMode("answer");
}
function tick() {
  const left = Math.max(0, deadline - Date.now());
  renderTimer(left);
  if (left <= 0) submitExam("timeup");
}
function submitExam(reason) {
  if (submitted) return;
  submitted = true;
  clearInterval(timerId);
  scored = scoreExam();
  scored.reason = reason;
  setMode("answer");
}
function resetAttempt() {   // 僅供預覽：清空重來
  started = false; submitted = false; scored = null; deadline = 0;
  clearInterval(timerId);
  Object.keys(RESP).forEach(k => delete RESP[k]);
  $("#timer-slot").innerHTML = "";
  setMode("answer");
}
function renderTimer(left) {
  const slot = $("#timer-slot");
  if (MODE !== "answer" || !started) { slot.innerHTML = ""; return; }
  if (submitted) {
    slot.innerHTML = `<div class="locked-banner">測驗已送出${scored?.reason === "timeup" ? "（時間到自動送出）" : ""}——
      記錄以第一次為準，不可重作。以下為作答結果，簡答題由管理員後續人工評分。</div>`;
    return;
  }
  const mm = String(Math.floor(left / 60000)).padStart(2, "0");
  const ss = String(Math.floor(left % 60000 / 1000)).padStart(2, "0");
  slot.innerHTML = `<div class="timer-bar${left < 5 * 60000 ? " low" : ""}">
    <span>作答者：<strong>${esc(examinee)}</strong></span>
    <span class="spacer" style="flex:1"></span>
    <span>剩餘時間</span><span class="clock">${mm}:${ss}</span></div>`;
}

/* ------------------------------------------------------------------ 渲染 */
function render() {
  const root = $("#exam-root");
  if (MODE === "answer" && !started && !submitted) {
    root.innerHTML = "";
    $("#timer-slot").innerHTML = "";
    if (!document.getElementById("pledge-overlay")) showPledge();
    return;
  }
  hidePledge();
  renderTimer(Math.max(0, deadline - Date.now()));
  root.innerHTML = "";
  if (scored && MODE === "answer") {
    const b = document.createElement("div");
    b.className = "q";
    b.innerHTML = `<span class="score-pill">自動計分：${scored.auto} / ${scored.autoMax} 分</span>
      　簡答題 ${scored.manualMax} 分待人工評分（滿分 ${EXAM.meta.totalPoints}）　｜　自動部分明細見各題下方`;
    root.appendChild(b);
  }
  Object.keys(QINDEX).forEach(k => delete QINDEX[k]);
  EXAM.sections.forEach(sec => sec.questions.forEach(q => { QINDEX[q.id] = q; }));
  EXAM.sections.forEach(sec => root.appendChild(renderSection(sec)));
  if (isLocked()) root.querySelectorAll("input, select, textarea, button").forEach(e => e.disabled = true);
  requestAnimationFrame(layoutAllMatchLines);
}
const QINDEX = {};

function renderSection(sec) {
  const wrap = document.createElement("section");
  wrap.className = "exam-section";
  wrap.innerHTML = `<h2>${esc(sec.title)}
    <span class="pts">每題 ${sec.pointsPer} 分・目標 ${sec.targetCount} 題・目前 ${sec.questions.length} 題</span></h2>
    <p class="hint">${esc(sec.instruction || "")}</p>`;
  const body = document.createElement("div");
  const fn = { truefalse: rTF, single: rSingle, multiple: rMulti, matching: rMatch, ordering: rOrder, shortanswer: rShort }[sec.type];
  sec.questions.forEach((q, i) => body.appendChild(fn(sec, q, i)));
  wrap.appendChild(body);
  if (MODE === "edit") {
    const add = document.createElement("button");
    add.className = "secondary-btn"; add.textContent = "＋ 新增題目";
    add.onclick = () => { collectEdits(); sec.questions.push(blankQuestion(sec.type)); render(); };
    wrap.appendChild(add);
  }
  return wrap;
}
function editHead(sec, q, i) {
  return `<button class="del" data-del>刪除</button><div class="edit-grid">
    <label>題目 ${i + 1}</label>
    <textarea class="form-control" rows="2" data-f="stem">${esc(q.stem)}</textarea>`;
}
function bindDel(el, sec, i) {
  el.querySelector("[data-del]").onclick = () => { collectEdits(); sec.questions.splice(i, 1); render(); };
}

/* ---- 一、是非題 ---- */
function rTF(sec, q, i) {
  const el = div("q");
  if (MODE === "edit") {
    el.innerHTML = editHead(sec, q, i) + `
      <label>正確答案</label>
      <select class="form-control" data-f="answer">
        <option value="true" ${q.answer ? "selected" : ""}>O（對）</option>
        <option value="false" ${!q.answer ? "selected" : ""}>X（錯）</option>
      </select></div>`;
    bindDel(el, sec, i);
  } else {
    el.innerHTML = `<p class="q-stem"><span class="n">${i + 1}.</span>${esc(q.stem)}</p>
      <div class="tf-row">
        <label class="opt"><input type="radio" name="${q.id}" value="true" ${RESP[q.id] === "true" ? "checked" : ""}> O 對</label>
        <label class="opt"><input type="radio" name="${q.id}" value="false" ${RESP[q.id] === "false" ? "checked" : ""}> X 錯</label>
      </div>${resultLine(q.id)}`;
    el.querySelectorAll("input").forEach(inp => inp.onchange = () => RESP[q.id] = inp.value);
  }
  return el;
}

/* ---- 二、單選題 ---- */
function rSingle(sec, q, i) {
  const el = div("q");
  if (MODE === "edit") {
    el.innerHTML = editHead(sec, q, i) + `
      <label>選項</label>
      <div class="edit-opts">${q.options.map((o, k) => `<input class="form-control" data-opt="${k}" value="${esc(o)}">`).join("")}</div>
      <label>正解</label>
      <select class="form-control" data-f="answer">
        ${q.options.map((o, k) => `<option value="${k}" ${q.answer === k ? "selected" : ""}>${k + 1}. ${esc(o)}</option>`).join("")}
      </select></div>`;
    bindDel(el, sec, i);
  } else {
    el.innerHTML = `<p class="q-stem"><span class="n">${i + 1}.</span>${esc(q.stem)}</p>
      ${q.options.map((o, k) => `<label class="opt"><input type="radio" name="${q.id}" value="${k}" ${String(RESP[q.id]) === String(k) ? "checked" : ""}><span>${"ABCD"[k] || k + 1}. ${esc(o)}</span></label>`).join("")}
      ${resultLine(q.id)}`;
    el.querySelectorAll("input").forEach(inp => inp.onchange = () => RESP[q.id] = Number(inp.value));
  }
  return el;
}

/* ---- 三、複選題 ---- */
function rMulti(sec, q, i) {
  const el = div("q");
  if (MODE === "edit") {
    el.innerHTML = editHead(sec, q, i) + `
      <label>選項與正解（勾選＝正確答案）</label>
      ${q.options.map((o, k) => `<div class="opt"><input type="checkbox" data-ans="${k}" ${q.answers.includes(k) ? "checked" : ""}><input class="form-control" data-opt="${k}" value="${esc(o)}"></div>`).join("")}
      </div>`;
    bindDel(el, sec, i);
  } else {
    const cur = RESP[q.id] || [];
    el.innerHTML = `<p class="q-stem"><span class="n">${i + 1}.</span>${esc(q.stem)} <span class="hint">（複選・全對才給分）</span></p>
      ${q.options.map((o, k) => `<label class="opt"><input type="checkbox" name="${q.id}" value="${k}" ${cur.includes(k) ? "checked" : ""}><span>${esc(o)}</span></label>`).join("")}
      ${resultLine(q.id)}`;
    el.querySelectorAll("input").forEach(inp => inp.onchange = () => {
      const set = new Set(RESP[q.id] || []);
      inp.checked ? set.add(Number(inp.value)) : set.delete(Number(inp.value));
      RESP[q.id] = [...set].sort((a, b) => a - b);
    });
  }
  return el;
}

/* ---- 四、連連看（點左項再點右項拉線；左右一一對應、無干擾；整組全對得 1 分）---- */
function rMatch(sec, q, i) {
  const el = div("q");
  if (MODE === "edit") {
    const balanced = q.left.length === q.right.length;
    el.innerHTML = editHead(sec, q, i) + `
      <label>左欄（每列 id|文字）</label>
      <textarea class="form-control" rows="4" data-mf="left">${q.left.map(x => x.id + "|" + x.text).join("\n")}</textarea>
      <label>右欄（每列 id|文字，數量須與左欄相等、無干擾項）</label>
      <textarea class="form-control" rows="4" data-mf="right">${q.right.map(x => x.id + "|" + x.text).join("\n")}</textarea>
      <label>正解（每列 左id=右id，需一一對應）</label>
      <textarea class="form-control" rows="4" data-mf="answer">${Object.entries(q.answer).map(([l, r]) => l + "=" + r).join("\n")}</textarea>
      ${balanced ? "" : '<p class="match-hint" style="color:var(--color-danger)">⚠ 左欄 ' + q.left.length + ' 項、右欄 ' + q.right.length + ' 項，數量不一致</p>'}
      </div>`;
    bindDel(el, sec, i);
  } else {
    const cur = RESP[q.id] || (RESP[q.id] = {});
    const node = (side, x) => `<button type="button" class="match-node" data-side="${side}" data-id="${esc(x.id)}"><span class="match-dot"></span><span class="match-label">${esc(x.text)}</span></button>`;
    el.innerHTML = `<p class="q-stem"><span class="n">${i + 1}.</span>${esc(q.stem)}</p>
      <p class="match-hint">點左邊項目，再點右邊項目即可連線；再點一次可取消。</p>
      <div class="match-board" data-qid="${esc(q.id)}">
        <div class="match-col match-col--left">${q.left.map(l => node("L", l)).join("")}</div>
        <svg class="match-lines"></svg>
        <div class="match-col match-col--right">${q.right.map(r => node("R", r)).join("")}</div>
      </div>
      <button type="button" class="match-clear">清除連線</button>
      ${resultLine(q.id)}`;

    const board = el.querySelector(".match-board");
    let pending = null;
    const paint = () => {
      board.querySelectorAll(".match-node").forEach(n => {
        const id = n.dataset.id, side = n.dataset.side;
        const linked = side === "L" ? !!cur[id] : Object.values(cur).includes(id);
        n.classList.toggle("is-linked", linked);
        n.classList.toggle("is-active", side === "L" && pending === id);
      });
      layoutAllMatchLines();
    };
    board.addEventListener("click", ev => {
      if (isLocked()) return;
      const n = ev.target.closest(".match-node"); if (!n) return;
      const id = n.dataset.id;
      if (n.dataset.side === "L") {
        // 點左項＝拿起（可重新配對）；再點同一項＝放下
        pending = (pending === id) ? null : id;
      } else {
        const usedBy = Object.keys(cur).find(l => cur[l] === id);
        if (pending) {
          if (cur[pending] === id) delete cur[pending];        // 點回原本連到的右項＝取消該連線
          else { if (usedBy) delete cur[usedBy]; cur[pending] = id; }
          pending = null;
        } else if (usedBy) {
          delete cur[usedBy];                                   // 沒有拿起時點右項＝斷開該連線
        }
      }
      paint();
    });
    el.querySelector(".match-clear").addEventListener("click", () => {
      if (isLocked()) return;
      Object.keys(cur).forEach(k => delete cur[k]); pending = null; paint();
    });
    paint();
  }
  return el;
}

/* 依 RESP 在每個 .match-board 上畫連線；批改後正確=綠、錯誤=紅、未連或連錯處以灰色虛線補上正解 */
function layoutAllMatchLines() {
  document.querySelectorAll(".match-board").forEach(board => {
    const qid = board.dataset.qid, q = QINDEX[qid];
    const svg = board.querySelector(".match-lines");
    if (!q || !svg) return;
    const br = board.getBoundingClientRect();
    const dot = (side, id) => board.querySelector(`.match-node[data-side="${side}"][data-id="${cssAttr(id)}"] .match-dot`);
    const center = elm => { const r = elm.getBoundingClientRect(); return [r.left + r.width / 2 - br.left, r.top + r.height / 2 - br.top]; };
    const graded = scored && scored.detail[qid] !== undefined;
    const pairs = RESP[qid] || {};
    let out = "";
    const seg = (a, b, stroke, dash) => {
      const la = dot("L", a), rb = dot("R", b); if (!la || !rb) return;
      const [x1, y1] = center(la), [x2, y2] = center(rb);
      out += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="2.5" stroke-linecap="round"${dash ? ' stroke-dasharray="5 5"' : ""}></line>`;
    };
    Object.entries(pairs).forEach(([l, r]) => seg(l, r, graded ? (q.answer[l] === r ? "var(--color-success)" : "var(--color-danger)") : "var(--color-brand)"));
    if (graded) Object.entries(q.answer).forEach(([l, r]) => { if (pairs[l] !== r) seg(l, r, "var(--text-muted)", true); });
    svg.innerHTML = out;
  });
}
function cssAttr(v) { return String(v).replace(/["\\]/g, "\\$&"); }

/* ---- 五、事件排序題：把事件像積木拖進「作答區」排序（每小題整題全對得 1 分）---- */
function rOrder(sec, q, i) {
  const el = div("q");
  if (MODE === "edit") {
    el.innerHTML = editHead(sec, q, i) + `
      <label>事件（每列 id|文字＝待排序區呈現順序，4～6 列）</label>
      <textarea class="form-control" rows="6" data-of="items">${q.items.map(x => x.id + "|" + x.text).join("\n")}</textarea>
      <label>正確順序（id 以逗號分隔）</label>
      <input class="form-control" data-of="answer" value="${esc(q.answer.join(","))}">
      </div>`;
    bindDel(el, sec, i);
    return el;
  }
  const placed = RESP[q.id] || (RESP[q.id] = []);
  const byId = Object.fromEntries(q.items.map(x => [x.id, x.text]));
  const pool = q.items.map(x => x.id).filter(id => !placed.includes(id));
  const graded = scored && scored.detail[q.id] !== undefined;
  const chip = (id, inAnswer, k) => {
    let cls = "order-chip";
    if (inAnswer && graded) cls += (q.answer[k] === id ? " chip-correct" : " chip-wrong");
    return `<div class="${cls}" data-id="${esc(id)}">${inAnswer ? `<span class="order-num">${k + 1}</span>` : `<span class="chip-grip">⠿</span>`}<span class="chip-text">${esc(byId[id])}</span>${inAnswer ? '<button type="button" class="chip-remove" aria-label="移回待排序">✕</button>' : ""}</div>`;
  };
  el.innerHTML = `<p class="q-stem"><span class="n">${i + 1}.</span>${esc(q.stem)}</p>
    <p class="order-hint">把下方事件拖進「作答區」，並在作答區內拖動調整順序（點一下事件也可直接加入）。</p>
    <div class="order-answer" data-qid="${esc(q.id)}" data-zone="answer">
      ${placed.length ? placed.map((id, k) => chip(id, true, k)).join("") : '<span class="order-empty">拖曳事件到這裡排序</span>'}
    </div>
    <p class="order-sub">待排序事件</p>
    <div class="order-pool" data-qid="${esc(q.id)}" data-zone="pool">
      ${pool.length ? pool.map(id => chip(id, false)).join("") : '<span class="order-empty">已全部放入作答區</span>'}
    </div>
    ${resultLine(q.id)}`;
  if (!isLocked()) initOrderDrag(el, q);
  return el;
}

/* 指標式拖曳（滑鼠＋觸控通用）：從 pool 拖到 answer、在 answer 內重排、拖回 pool 移除 */
function initOrderDrag(root, q) {
  const list = RESP[q.id];
  let drag = null;

  const zoneAt = (x, y) => {
    const t = document.elementFromPoint(x, y);
    return t && t.closest(".order-answer, .order-pool");
  };
  const answerIndexAt = (zone, y, skipId) => {
    const chips = [...zone.querySelectorAll(".order-chip")].filter(c => c.dataset.id !== skipId);
    for (let k = 0; k < chips.length; k++) {
      const r = chips[k].getBoundingClientRect();
      if (y < r.top + r.height / 2) return k;
    }
    return chips.length;
  };
  const clearIndicator = () => root.querySelectorAll(".order-indicator").forEach(n => n.remove());
  const showIndicator = (zone, idx) => {
    clearIndicator();
    const ind = document.createElement("div");
    ind.className = "order-indicator";
    const chips = [...zone.querySelectorAll(".order-chip")].filter(c => c.dataset.id !== drag.id);
    if (idx >= chips.length) zone.appendChild(ind); else zone.insertBefore(ind, chips[idx]);
  };

  root.querySelectorAll(".order-chip").forEach(chipEl => {
    chipEl.addEventListener("pointerdown", ev => {
      if (isLocked() || ev.target.closest(".chip-remove")) return;
      ev.preventDefault();
      const rect = chipEl.getBoundingClientRect();
      drag = {
        id: chipEl.dataset.id, startX: ev.clientX, startY: ev.clientY, moved: false,
        fromZone: chipEl.closest("[data-zone]").dataset.zone,
        ghost: null, dx: ev.clientX - rect.left, dy: ev.clientY - rect.top, w: rect.width
      };
      try { chipEl.setPointerCapture(ev.pointerId); } catch (_) {}
    });
    chipEl.addEventListener("pointermove", ev => {
      if (!drag || drag.id !== chipEl.dataset.id) return;
      const dist = Math.hypot(ev.clientX - drag.startX, ev.clientY - drag.startY);
      if (!drag.moved && dist < 6) return;
      if (!drag.moved) {
        drag.moved = true;
        const g = chipEl.cloneNode(true);
        g.classList.remove("is-placeholder"); g.classList.add("ghost"); g.style.width = drag.w + "px";
        document.body.appendChild(g); drag.ghost = g;
        chipEl.classList.add("is-placeholder");
      }
      drag.ghost.style.left = (ev.clientX - drag.dx) + "px";
      drag.ghost.style.top = (ev.clientY - drag.dy) + "px";
      const zone = zoneAt(ev.clientX, ev.clientY);
      root.querySelectorAll(".order-answer, .order-pool").forEach(z => z.classList.toggle("drop-hot", z === zone));
      if (zone && zone.dataset.zone === "answer") showIndicator(zone, answerIndexAt(zone, ev.clientY, drag.id));
      else clearIndicator();
    });
    const finish = ev => {
      if (!drag || drag.id !== chipEl.dataset.id) return;
      const id = drag.id, cur = list.indexOf(id);
      if (!drag.moved) {                       // 點一下：pool → 追加到作答區
        if (drag.fromZone === "pool") list.push(id);
      } else {
        const zone = zoneAt(ev.clientX, ev.clientY);
        if (zone && zone.dataset.zone === "answer") {
          let idx = answerIndexAt(zone, ev.clientY, id);
          if (cur !== -1) { list.splice(cur, 1); if (cur < idx) idx--; }
          list.splice(idx, 0, id);
        } else if (zone && zone.dataset.zone === "pool") {
          if (cur !== -1) list.splice(cur, 1);
        }
      }
      if (drag.ghost) drag.ghost.remove();
      clearIndicator();
      drag = null;
      render();
    };
    chipEl.addEventListener("pointerup", finish);
    chipEl.addEventListener("pointercancel", finish);
  });

  root.querySelectorAll(".chip-remove").forEach(btn => btn.addEventListener("click", ev => {
    ev.stopPropagation();
    if (isLocked()) return;
    const id = btn.closest(".order-chip").dataset.id;
    const k = list.indexOf(id); if (k !== -1) list.splice(k, 1);
    render();
  }));
}

/* ---- 六、簡答題 ---- */
function rShort(sec, q, i) {
  const el = div("q");
  if (MODE === "edit") {
    el.innerHTML = editHead(sec, q, i) + `
      <label>參考答案（給評分者看）</label>
      <textarea class="form-control" rows="3" data-f="referenceAnswer">${esc(q.referenceAnswer)}</textarea>
      <label>評分要點（每列一項）</label>
      <textarea class="form-control" rows="3" data-f="rubric">${esc((q.rubric || []).join("\n"))}</textarea>
      <label>配分</label>
      <input class="form-control" data-f="maxPoints" value="${q.maxPoints}">
      </div>`;
    bindDel(el, sec, i);
  } else {
    el.innerHTML = `<p class="q-stem"><span class="n">${i + 1}.</span>${esc(q.stem)} <span class="hint">（${q.maxPoints} 分・人工評分）</span></p>
      <textarea class="form-control" rows="4" placeholder="請在此作答" data-sa="${q.id}">${esc(RESP[q.id] || "")}</textarea>
      <p class="result-line hint">送出後由管理員依評分要點給 0～${q.maxPoints} 分。</p>`;
    el.querySelector("textarea").oninput = e => RESP[q.id] = e.target.value;
  }
  return el;
}

/* ------------------------------------------------------------------ 批改（一～五自動，全對才給分） */
function scoreExam() {
  let auto = 0, autoMax = 0, manualMax = 0;
  const detail = {};
  EXAM.sections.forEach(sec => {
    sec.questions.forEach(q => {
      if (sec.type === "shortanswer") { manualMax += q.maxPoints; return; }
      autoMax += sec.pointsPer;
      let good = false;
      if (sec.type === "truefalse") good = typeof q.answer === "boolean" && RESP[q.id] === String(q.answer);
      else if (sec.type === "single") good = q.answer != null && Number(RESP[q.id]) === q.answer;
      else if (sec.type === "multiple") good = Array.isArray(q.answers) && q.answers.length > 0 && JSON.stringify(RESP[q.id] || []) === JSON.stringify(q.answers.slice().sort((a, b) => a - b));
      else if (sec.type === "matching") {
        const r = RESP[q.id] || {}, ans = q.answer || {};
        good = Object.keys(ans).length === q.left.length && q.left.every(l => r[l.id] === ans[l.id]);
      } else if (sec.type === "ordering") {
        const got = RESP[q.id] || [], ans = q.answer || [];
        good = ans.length > 0 && got.length === ans.length && got.join(",") === ans.join(",");
      }
      detail[q.id] = good;
      if (good) auto += sec.pointsPer;
    });
  });
  return { auto, autoMax, manualMax, detail };
}
function resultLine(id) {
  if (!scored) return "";
  const g = scored.detail[id];
  if (g === undefined) return "";
  return `<div class="result-line ${g ? "ok" : "bad"}">${g ? "✓ 答對" : "✗ 答錯（或未完成）"}</div>`;
}

/* ------------------------------------------------------------------ 編輯模式：收集回 EXAM */
function collectEdits() {
  if (MODE !== "edit") return;
  document.querySelectorAll(".exam-section").forEach((secEl, si) => {
    const sec = EXAM.sections[si];
    secEl.querySelectorAll(".q").forEach((qe, qi) => {
      const q = sec.questions[qi]; if (!q) return;
      qe.querySelectorAll("[data-f]").forEach(f => {
        const k = f.dataset.f, v = f.value;
        if (k === "answer") q[k] = sec.type === "truefalse" ? (v === "true") : Number(v);
        else if (k === "maxPoints") q[k] = Number(v);
        else if (k === "rubric") q[k] = v.split("\n").map(s => s.trim()).filter(Boolean);
        else q[k] = v;
      });
      qe.querySelectorAll("[data-opt]").forEach(o => q.options[+o.dataset.opt] = o.value);
      if (sec.type === "multiple") {
        q.answers = [...qe.querySelectorAll("[data-ans]")].filter(c => c.checked).map(c => +c.dataset.ans).sort((a, b) => a - b);
      }
      if (sec.type === "matching") {
        const rows = k => (qe.querySelector(`[data-mf="${k}"]`).value.trim().split("\n").filter(Boolean));
        q.left = rows("left").map(r => ({ id: r.split("|")[0].trim(), text: (r.split("|")[1] || "").trim() }));
        q.right = rows("right").map(r => ({ id: r.split("|")[0].trim(), text: (r.split("|")[1] || "").trim() }));
        q.answer = {}; rows("answer").forEach(r => { const [l, rr] = r.split("="); q.answer[l.trim()] = (rr || "").trim(); });
      }
      if (sec.type === "ordering") {
        q.items = qe.querySelector('[data-of="items"]').value.trim().split("\n").filter(Boolean)
          .map(r => ({ id: r.split("|")[0].trim(), text: (r.split("|")[1] || "").trim() }));
        q.answer = qe.querySelector('[data-of="answer"]').value.split(",").map(s => s.trim()).filter(Boolean);
      }
    });
  });
}

/* ------------------------------------------------------------------ 小工具 */
function div(cls) { const d = document.createElement("div"); d.className = cls; return d; }
function blankQuestion(type) {
  const id = "q" + Math.random().toString(36).slice(2, 7);
  if (type === "truefalse") return { id, stem: "", answer: true };
  if (type === "single") return { id, stem: "", options: ["", "", "", ""], answer: 0 };
  if (type === "multiple") return { id, stem: "", options: ["", "", "", ""], answers: [] };
  if (type === "matching") return { id, stem: "", left: [{ id: "L1", text: "" }, { id: "L2", text: "" }, { id: "L3", text: "" }, { id: "L4", text: "" }], right: [{ id: "R1", text: "" }, { id: "R2", text: "" }, { id: "R3", text: "" }, { id: "R4", text: "" }], answer: { L1: "R1", L2: "R2", L3: "R3", L4: "R4" } };
  if (type === "ordering") return { id, stem: "", items: [{ id: "E1", text: "" }, { id: "E2", text: "" }, { id: "E3", text: "" }, { id: "E4", text: "" }], answer: [] };
  if (type === "shortanswer") return { id, stem: "", referenceAnswer: "", rubric: [], maxPoints: 10 };
  return { id, stem: "" };
}

window.addEventListener("resize", layoutAllMatchLines);
setMode("answer");
